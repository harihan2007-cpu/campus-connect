<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ chatbot_title }}</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--border:#e5e7eb;--text:#111827;--muted:#667085;--primary:#4f46e5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at top left,#4f46e51f,transparent 32%),radial-gradient(circle at bottom right,#0ea5e91a,transparent 28%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(1080px,100%);height:min(820px,calc(100vh - 48px));min-height:600px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;background:rgba(255,255,255,.94);border-radius:28px;box-shadow:0 24px 70px #0f172a1f}
.header{padding:22px 26px;color:#fff;background:linear-gradient(135deg,#111827,#312e81 60%,#4f46e5)}
.brand{display:flex;align-items:center;gap:14px}.logo{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:#ffffff24;border:1px solid #ffffff33;font-size:22px}
h1{margin:0;font-size:clamp(20px,3vw,27px)}.purpose{margin:5px 0 0;color:#ffffffc7;font-size:13px;line-height:1.5;max-width:760px}
.chat{overflow-y:auto;padding:28px clamp(16px,5vw,58px);scroll-behavior:smooth}.welcome{max-width:720px;margin:16px auto 28px;padding:22px;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,#fff,#f8faff);text-align:center}
.welcome-icon{font-size:32px}.welcome h2{margin:8px 0 7px;font-size:19px}.welcome p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.message-row{display:flex;margin:14px 0;animation:rise .2s ease-out}.message-row.user{justify-content:flex-end}.message-row.assistant{justify-content:flex-start}
.message{max-width:min(78%,700px);padding:13px 16px;border-radius:18px;line-height:1.6;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{color:#fff;background:linear-gradient(135deg,#4f46e5,#6366f1);border-bottom-right-radius:6px}.message.assistant{background:#fff;border:1px solid var(--border);border-bottom-left-radius:6px}
.typing{display:none;align-items:center;gap:5px;width:fit-content;margin:12px 0;padding:12px 15px;border-radius:16px;border:1px solid var(--border);background:#fff}.typing.show{display:flex}.dot{width:7px;height:7px;border-radius:50%;background:#9ca3af;animation:bounce 1.1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
.composer{padding:16px 22px 20px;border-top:1px solid var(--border);background:#ffffffe6}.input-wrap{display:flex;align-items:flex-end;gap:10px;max-width:900px;margin:auto;padding:9px;border:1px solid #dfe3ea;border-radius:20px;background:#fff;box-shadow:0 8px 30px #0f172a0f}
textarea{flex:1;resize:none;border:0;outline:0;min-height:44px;max-height:130px;padding:10px 12px;font:inherit;font-size:14px;background:transparent}button{border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#4f46e5,#6366f1);width:46px;height:46px;border-radius:14px;font-size:18px}button:disabled{opacity:.55;cursor:not-allowed}
.hint{margin:9px auto 0;max-width:900px;color:#98a2b3;font-size:11px;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes bounce{0%,70%,100%{transform:translateY(0);opacity:.45}35%{transform:translateY(-5px);opacity:1}}
@media(max-width:700px){body{padding:0}.app{width:100%;height:100vh;min-height:100vh;border-radius:0}.header{padding:18px}.chat{padding:20px 13px}.message{max-width:88%}.composer{padding:12px}.welcome{margin-top:4px}}
</style>
</head>
<body>
<main class="app">
<header class="header"><div class="brand"><div class="logo">✦</div><div><h1>{{ chatbot_title }}</h1><p class="purpose">{{ chatbot_purpose }}</p></div></div></header>
<section class="chat" id="chat" aria-live="polite">
<div class="welcome" id="welcome"><div class="welcome-icon">💬</div><h2>Welcome to {{ chatbot_title }}</h2><p>{{ chatbot_purpose }}. Ask a question related to this domain and I’ll help you.</p></div>
<div id="messages"></div>
<div class="typing" id="typing" aria-label="AI is typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</section>
<footer class="composer"><div class="input-wrap"><textarea id="messageInput" rows="1" placeholder="Ask a {{ chatbot_title }} question..." aria-label="Message"></textarea><button id="sendButton" type="button" aria-label="Send message">➤</button></div><div class="hint">Enter to send · Shift + Enter for a new line</div></footer>
</main>
<script>
const messagesEl=document.getElementById("messages"),chatEl=document.getElementById("chat"),inputEl=document.getElementById("messageInput"),sendButton=document.getElementById("sendButton"),typingEl=document.getElementById("typing"),welcomeEl=document.getElementById("welcome");
let history=[],busy=false;
function addMessage(role,content){const row=document.createElement("div");row.className=`message-row ${role}`;const bubble=document.createElement("div");bubble.className=`message ${role}`;bubble.textContent=content;row.appendChild(bubble);messagesEl.appendChild(row);chatEl.scrollTop=chatEl.scrollHeight}
function setBusy(v){busy=v;sendButton.disabled=v;inputEl.disabled=v;typingEl.classList.toggle("show",v);chatEl.scrollTop=chatEl.scrollHeight}
async function sendMessage(){const message=inputEl.value.trim();if(!message||busy)return;if(welcomeEl)welcomeEl.style.display="none";addMessage("user",message);inputEl.value="";inputEl.style.height="auto";setBusy(true);
try{const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,history:history.slice(-20)})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.reply)throw new Error(data.error||"The chatbot could not process your request right now.");addMessage("assistant",data.reply);history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-20)}
catch(error){addMessage("assistant",error.message||"The chatbot could not process your request right now.")}finally{setBusy(false);inputEl.focus()}}
sendButton.addEventListener("click",sendMessage);inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});inputEl.addEventListener("input",()=>{inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,130)+"px"});inputEl.focus();
</script>
</body>
</html>
